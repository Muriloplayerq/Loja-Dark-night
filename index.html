<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK NIGHT - Loja</title>
<style>
    body{background:#000;color:#fff;font-family:Arial;margin:0;text-align:center}
    header{background:linear-gradient(90deg,#8a2be2,#9400d3);padding:20px;font-size:28px;font-weight:bold;box-shadow:0 0 15px #9400d3}
    h2{color:#9400d3;margin:20px;font-size:24px;text-shadow:0 0 10px #9400d3}
    .container{padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:20px}
    .kit{background:#111;border:2px solid #9400d3;border-radius:15px;padding:20px;width:90%;max-width:400px;box-shadow:0 0 20px #9400d3;transition:0.3s}
    .kit:hover{transform:scale(1.03);box-shadow:0 0 30px #8a2be2}
    .kit h3{color:#9400d3;font-size:20px;margin:0 0 10px}
    .kit p{font-size:22px;color:#fff;font-weight:bold;margin:0 0 15px}
    .btn{background:#9400d3;border:none;padding:12px 25px;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;font-size:16px;transition:0.3s;width:100%}
    .btn:hover{background:#8a2be2;box-shadow:0 0 15px #8a2be2}
</style>
</head>
<body>
<header>⚔️ DARK NIGHT ⚔️</header>
<h2>LOJA DE KITS</h2>
<div class="container" id="kits"></div>

<script>
const kits = [
    {nome:"[ KIT CLÃ ]", preco:50},
    {nome:"[ KIT ASTRALY ]", preco:75},
    {nome:"[ KIT BÁSICO ]", preco:40},
    {nome:"[ KIT NETHER CLÃ ]", preco:60},
    {nome:"[ KIT SQUAD ]", preco:30},
    {nome:"[ KIT NETHER SQUAD ]", preco:40},
    {nome:"[ KIT DUO ]", preco:15},
    {nome:"[ KIT DUO CLÃ ]", preco:10},
    {nome:"[ KIT NETHER ]", preco:7},
    {nome:"[ KIT DIMA ULTRA ]", preco:4}
];

const container = document.getElementById('kits');
kits.forEach(kit=>{
    container.innerHTML += `
    <div class="kit">
        <h3>${kit.nome}</h3>
        <p>R$ ${kit.preco.toFixed(2).replace('.',',')}</p>
        <button class="btn" onclick="comprar('${kit.nome}',${kit.preco})">Comprar Agora</button>
    </div>`;
});

function comprar(nome, preco){
    localStorage.setItem('kitNome', nome);
    localStorage.setItem('kitPreco', preco);
    window.location.href = 'carrinho.html';
}
</script>
</body>
</html>
