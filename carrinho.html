<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - DARK NIGHT</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}
h2{font-size:24px;margin-bottom:10px}
h3{font-size:20px;margin-bottom:5px}
p{font-size:16px}
.pix-chave{background:#222;padding:18px;border-radius:10px;margin:20px auto;width:95%;max-width:500px;word-break:break-all;font-size:16px;font-weight:bold}
.btn{background:#ff0044;color:#fff;border:none;padding:16px 30px;border-radius:10px;cursor:pointer;font-size:18px;font-weight:bold;margin:12px;width:90%;max-width:400px}
.btn:hover{background:#cc0033}
.copiar{background:#00cc66}
.copiar:hover{background:#009944}
.sucesso{color:#00ff88;margin-top:20px;font-size:17px;font-weight:bold;display:none}
</style>
</head>
<body>

<h2>🛒 FINALIZAR COMPRA - DARK NIGHT</h2>
<h3>Pague com Pix</h3>
<p>Escaneie ou copie a chave:</p>

<div class="pix-chave" id="pixCopia">437144b6-5d40-4f01-b803-c33d1bf041c0</div>

<button class="btn copiar" onclick="copiarPix()">Copiar Pix</button>
<br>
<button class="btn" onclick="enviarComprovante()">📎 Enviar Comprovante</button>

<p class="sucesso" id="msgSucesso">✅ Comprovante enviado! Aguarde no ticket do Discord.</p>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1535637553561215057/3kaQz4ebAiBWEsfbvCfaF0-ILkrQOPyO4ObTlUctWJiKclcVOyDTYpQawB9jybKO3r2H";

function copiarPix(){
  const chave = document.getElementById('pixCopia').innerText;
  navigator.clipboard.writeText(chave);
  alert('Chave Pix copiada!');
}

function enviarComprovante(){
  const data = new Date().toLocaleString('pt-BR');
  const mensagem = {
    "content": "🔔 **NOVO PEDIDO - DARK NIGHT** 🔔\nCliente clicou em 'Enviar Comprovante'.\n**Data:** " + data + "\n**Aguardando comprovante no ticket.**"
  };

  fetch(WEBHOOK_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(mensagem)
  }).then(() => {
    document.getElementById('msgSucesso').style.display = 'block';
  }).catch(() => {
    alert('Erro ao enviar. Me chama no Discord.');
  });
}
</script>

</body>
</html>
